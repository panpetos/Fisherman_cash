<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-commerce Header Navigation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Manrope:wght@400&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          "Inter",
          -apple-system,
          Roboto,
          Helvetica,
          sans-serif;
        background: #fff;
      }

      .top-banner {
        background: #2b2b2b;
        padding: 5px 0;
        text-align: center;
      }

      .top-banner-text {
        color: #fff;
        font-family:
          "Manrope",
          -apple-system,
          Roboto,
          Helvetica,
          sans-serif;
        font-size: 14px;
        font-weight: 400;
        line-height: 145%;
      }

      .header-container {
        background: #fff;
        border-bottom: 1px solid rgba(217, 217, 217, 0.3);
      }

      .header-content {
        max-width: 1920px;
        margin: 0 auto;
        padding: 0 20px;
      }

      .main-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        height: 37px;
        padding: 39px 0;
        position: relative;
      }

      .logo {
        width: 177px;
        height: 20px;
        flex-shrink: 0;
      }

      .center-section {
        display: flex;
        align-items: center;
        gap: 30px;
        flex: 1;
        justify-content: center;
        max-width: 482px;
      }

      .phone-section {
        display: flex;
        align-items: center;
        gap: 21px;
      }

      .phone-info {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .phone-icon {
        width: 15px;
        height: 15px;
        opacity: 0.2;
      }

      .phone-number {
        color: #000;
        font-size: 17px;
        font-weight: 700;
        white-space: nowrap;
      }

      .request-quote-btn {
        padding: 10px 29px;
        border: 1px solid #000;
        border-radius: 8px;
        background: transparent;
        color: #404040;
        font-size: 13px;
        font-weight: 400;
        opacity: 0.9;
        cursor: pointer;
        white-space: nowrap;
      }

      .social-icons {
        display: flex;
        gap: 11px;
      }

      .social-icon {
        width: 35px;
        height: 34px;
        border: 1px solid #000;
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0.2;
        cursor: pointer;
      }

      .right-section {
        display: flex;
        align-items: center;
        gap: 21px;
      }

      .search-container {
        display: flex;
        align-items: center;
        width: 259px;
        height: 40px;
        background: #f8f8f7;
        border-radius: 8px;
        padding: 0 13px;
        gap: 22px;
      }

      .search-icon {
        width: 13px;
        height: 14px;
        opacity: 0.4;
      }

      .search-input {
        border: none;
        background: transparent;
        outline: none;
        font-size: 13px;
        color: #404040;
        opacity: 0.4;
        flex: 1;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 21px;
      }

      .cart-icon-container {
        position: relative;
        width: 22px;
        height: 22px;
      }

      .cart-badge {
        position: absolute;
        top: -6px;
        right: -6px;
        background: #e62430;
        color: white;
        border-radius: 50%;
        width: 12px;
        height: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 8.9375px;
        font-weight: bold;
      }

      .user-icon {
        width: 22px;
        height: 22px;
      }

      .navigation-bar {
        display: flex;
        align-items: center;
        height: 62px;
        border-top: 1px solid rgba(217, 217, 217, 0.3);
        border-bottom: 1px solid rgba(217, 217, 217, 0.3);
        position: relative;
      }

      .catalog-button {
        background: #55ae17;
        color: white;
        border: none;
        height: 60px;
        width: 124px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding-left: 20px;
        cursor: pointer;
        position: relative;
      }

      .catalog-icon {
        display: grid;
        grid-template-columns: repeat(3, 3px);
        gap: 2px;
      }

      .catalog-dot {
        width: 3px;
        height: 3px;
        background: white;
        border-radius: 50%;
      }

      .catalog-text {
        font-size: 14px;
        font-weight: 700;
      }

      .nav-menu {
        display: flex;
        align-items: center;
        gap: 0;
        height: 100%;
        flex: 1;
      }

      .nav-item {
        display: flex;
        align-items: center;
        height: 100%;
        padding: 0 24px;
        border-right: 1px solid rgba(217, 217, 217, 0.5);
        cursor: pointer;
        gap: 8px;
      }

      .nav-item:last-child {
        border-right: none;
      }

      .nav-text {
        color: #000;
        font-size: 14px;
        font-weight: 400;
        white-space: nowrap;
      }

      .dropdown-arrow {
        width: 8px;
        height: 5px;
        transform: rotate(90deg);
      }

      .divider {
        width: 1px;
        height: 60px;
        background: rgba(217, 217, 217, 0.5);
      }

      /* Responsive Design */
      @media (max-width: 1200px) {
        .header-content {
          padding: 0 15px;
        }

        .center-section {
          gap: 20px;
        }

        .search-container {
          width: 200px;
        }
      }

      @media (max-width: 768px) {
        .main-header {
          flex-direction: column;
          gap: 20px;
          height: auto;
          padding: 20px 0;
        }

        .center-section {
          flex-direction: column;
          gap: 15px;
          max-width: none;
          width: 100%;
        }

        .phone-section {
          flex-direction: column;
          gap: 15px;
          align-items: center;
        }

        .social-icons {
          justify-content: center;
        }

        .right-section {
          width: 100%;
          justify-content: space-between;
        }

        .search-container {
          width: 100%;
          max-width: 300px;
        }

        .navigation-bar {
          flex-wrap: wrap;
          height: auto;
          padding: 10px 0;
        }

        .catalog-button {
          width: 100%;
          justify-content: center;
          margin-bottom: 10px;
        }

        .nav-menu {
          flex-wrap: wrap;
          justify-content: center;
          gap: 10px;
        }

        .nav-item {
          border-right: none;
          padding: 10px 15px;
          border-bottom: 1px solid rgba(217, 217, 217, 0.3);
        }

        .phone-number {
          font-size: 16px;
        }
      }

      @media (max-width: 480px) {
        .logo {
          width: 140px;
          height: 16px;
        }

        .nav-item {
          padding: 8px 12px;
        }

        .catalog-button {
          width: 100px;
          font-size: 12px;
        }

        .search-container {
          width: 100%;
        }
      }
    </style>
  </head>
